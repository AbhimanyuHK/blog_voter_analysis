[tool.poetry]
name = "blog-voter-analysis"
version = "0.1.0"
description = "Incremental DuckDB votes ingestion and weekly outlier detection"
authors = ["Abhimanyu HK"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
duckdb = ">=1.1,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
